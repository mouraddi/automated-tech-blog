<body>
    <header class="navbar">
        <div class="container">
            <a href="/" class="logo">Vokaso<span>Deals</span></a>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h1>Verified Coupon Codes & Daily Deals</h1>
            <p>Save money on your favorite stores with top promo discounts.</p>
        </section>

        <div class="coupons-grid">

        <div class="container">

        </div>
    </footer>

    <script>
        function copyCode(code, element) {
            navigator.clipboard.writeText(code);
            element.innerText = "COPIED!";
            element.classList.add("copied");
            setTimeout(() => {
                element.innerText = "COPY CODE";
                element.classList.remove("copied");
            }, 2000);
        }
    </script>
</body>
