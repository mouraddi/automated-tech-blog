<body>
    <header class="navbar">
        <div class="container">
            <a href="/" class="logo">Vokaso<span>Deals</span></a>

    <main class="container">
        <section class="hero">
            <h1>Verified Coupon Codes & Daily Deals</h1>

        <div class="coupons-grid">

                <h3 class="coupon-title">AliExpress Special Promo Discount</h3>
                <p class="coupon-summary">Get up to  off on selected electronics and tech gadgets with this verified promo code.</p>
                <div class="coupon-actions">
                    
                    <button class="btn-copy" onclick="copyCode('VOKASO50', this)">COPY CODE</button>

    <script>
        function copyCode(code, element) {
            navigator.clipboard.writeText(code);
            element.innerText = "COPIED!";
            element.classList.add("copied");
            setTimeout(() => {
                element.innerText = "COPY CODE";
                element.classList.remove("copied");
            }, 2000);
        }
    </script>
